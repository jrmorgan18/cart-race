<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cart Race</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', 'Comic Sans MS', Arial, sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #gameContainer {
    position: relative;
    width: 900px;
    height: 600px;
    max-width: 100vw;
    max-height: 100vh;
    background: #87CEEB;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }

  /* Scale the game to fit the screen */
  @media (max-width: 920px), (max-height: 620px) {
    #gameContainer {
      width: 100vw;
      height: calc(100vw * 600 / 900);
      max-height: 100vh;
      border-radius: 0;
    }
    /* If height is the constraint, fit to height instead */
    @supports (aspect-ratio: 3/2) {
      #gameContainer {
        width: min(100vw, calc(100vh * 900 / 600));
        height: min(100vh, calc(100vw * 600 / 900));
        aspect-ratio: 3 / 2;
      }
    }
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .screen.active { display: flex; }

  /* ---- Title Screen ---- */
  #titleScreen {
    background: linear-gradient(180deg, #4fc3f7 0%, #81d4fa 40%, #a5d6a7 60%, #66bb6a 100%);
  }

  #titleScreen h1 {
    font-size: 72px;
    color: #fff;
    text-shadow: 4px 4px 0 #e65100, 6px 6px 0 rgba(0,0,0,0.2);
    margin-bottom: 10px;
    letter-spacing: 4px;
  }

  #titleScreen .subtitle {
    font-size: 20px;
    color: #fff9c4;
    text-shadow: 1px 1px 0 #333;
    margin-bottom: 30px;
  }

  .btn {
    padding: 14px 48px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #ff6f00, #ff8f00);
    color: #fff;
    box-shadow: 0 4px 15px rgba(255,111,0,0.4);
  }

  .btn-green {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    color: #fff;
    box-shadow: 0 4px 15px rgba(67,160,71,0.4);
  }

  .btn-blue {
    background: linear-gradient(135deg, #1e88e5, #42a5f5);
    color: #fff;
    box-shadow: 0 4px 15px rgba(30,136,229,0.4);
  }

  .title-car-container {
    width: 180px;
    height: 80px;
    margin-bottom: 20px;
  }

  /* ---- Selection Screen ---- */
  #selectScreen {
    background: linear-gradient(180deg, #e1bee7 0%, #f8bbd0 50%, #ffccbc 100%);
    padding: 14px 20px;
    gap: 6px;
  }

  #selectScreen h2 {
    font-size: 32px;
    color: #4a148c;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
    margin-bottom: 2px;
  }

  .select-section {
    text-align: center;
  }

  .select-section h3 {
    font-size: 17px;
    color: #4a148c;
    margin-bottom: 4px;
  }

  .option-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .option-btn {
    padding: 8px 16px;
    font-size: 15px;
    font-weight: bold;
    border: 3px solid transparent;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s;
    background: rgba(255,255,255,0.7);
    color: #333;
  }

  .option-btn:hover {
    transform: scale(1.05);
    background: rgba(255,255,255,0.95);
  }

  .option-btn.selected {
    border-color: #ff6f00;
    background: #fff;
    box-shadow: 0 0 12px rgba(255,111,0,0.5);
    transform: scale(1.05);
  }

  .car-option {
    width: 80px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }

  .car-option canvas {
    width: 72px;
    height: 45px;
  }

  .driver-option {
    width: 72px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
  }

  .driver-option canvas {
    width: 64px;
    height: 64px;
  }

  /* ---- Question Popup ---- */
  #questionOverlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  #questionOverlay.active { display: flex; }

  .question-box {
    background: linear-gradient(145deg, #fff, #f3e5f5);
    border-radius: 20px;
    padding: 28px 32px;
    width: 520px;
    max-width: 90%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align: center;
    animation: popIn 0.3s ease-out;
  }

  @keyframes popIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .question-box .boost-label {
    font-size: 14px;
    color: #ff6f00;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .question-box .q-text {
    font-size: 22px;
    color: #333;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .answer-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
    border: 3px solid #ce93d8;
    border-radius: 14px;
    background: #fff;
    color: #4a148c;
    cursor: pointer;
    transition: all 0.15s;
  }

  .answer-btn:hover {
    background: #f3e5f5;
    border-color: #ab47bc;
    transform: scale(1.02);
  }

  .answer-btn.correct {
    background: #c8e6c9;
    border-color: #43a047;
    color: #2e7d32;
  }

  .answer-btn.wrong {
    background: #ffcdd2;
    border-color: #e53935;
    color: #c62828;
  }

  .answer-btn:disabled {
    cursor: default;
    transform: none;
  }

  .result-text {
    font-size: 20px;
    font-weight: bold;
    margin-top: 10px;
    min-height: 30px;
  }

  /* ---- Finish Screen ---- */
  #finishScreen {
    background: linear-gradient(180deg, #311b92 0%, #4a148c 50%, #880e4f 100%);
    padding: 20px;
  }

  #finishScreen h2 {
    font-size: 42px;
    color: #ffd54f;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }

  .finish-buttons {
    display: flex;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .finish-buttons .btn { font-size: 18px; padding: 10px 28px; }

  #finishPoints {
    color: #ffd54f;
    font-size: 18px;
    font-weight: bold;
    margin-top: 4px;
  }

  /* ---- Prize Screen ---- */
  #prizeScreen {
    background: linear-gradient(180deg, #1a237e 0%, #283593 40%, #3949ab 100%);
    padding: 20px;
    gap: 10px;
  }

  #prizeScreen h2 {
    font-size: 36px;
    color: #ffd54f;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  }

  .prize-total {
    font-size: 22px;
    color: #fff;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .prize-list {
    width: 90%;
    max-width: 500px;
    max-height: 320px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .prize-item {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: bold;
    transition: transform 0.15s;
  }

  .prize-item.earned {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    color: #fff;
    box-shadow: 0 2px 10px rgba(67,160,71,0.4);
    cursor: pointer;
  }

  .prize-item.earned:active {
    transform: scale(0.97);
  }

  .prize-item.locked {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
  }

  /* Confirm Redeem Modal */
  #redeemModal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  #redeemModal.active {
    display: flex;
  }
  .redeem-box {
    background: linear-gradient(135deg, #283593, #3949ab);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 360px;
    width: 85%;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    border: 3px solid #ffd54f;
  }
  .redeem-box h3 {
    color: #ffd54f;
    font-size: 22px;
    margin: 0 0 12px;
  }
  .redeem-box p {
    color: #fff;
    font-size: 16px;
    margin: 8px 0;
  }
  .redeem-box .redeem-reward {
    font-size: 20px;
    font-weight: bold;
    color: #81c784;
    margin: 14px 0;
  }
  .redeem-box .redeem-cost {
    color: #ef9a9a;
    font-size: 15px;
  }
  .redeem-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 18px;
  }

  /* Prize Bin */
  .prize-bin-label {
    color: #ffd54f;
    font-size: 20px;
    font-weight: bold;
    margin-top: 6px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
  }
  .prize-bin {
    width: 90%;
    max-width: 500px;
    max-height: 140px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .prize-bin-item {
    display: flex;
    align-items: center;
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
    background: linear-gradient(135deg, #6a1b9a, #8e24aa);
    color: #fff;
    box-shadow: 0 2px 8px rgba(106,27,154,0.4);
  }
  .prize-bin-item .prize-icon {
    margin-right: 10px;
    font-size: 18px;
  }
  .prize-bin-empty {
    color: rgba(255,255,255,0.45);
    font-size: 14px;
    font-style: italic;
  }

  .prize-item .prize-pts {
    min-width: 60px;
    text-align: center;
    margin-right: 12px;
    font-size: 18px;
  }

  .prize-item .prize-icon {
    margin-right: 10px;
    font-size: 20px;
  }

  .prize-buttons {
    display: flex;
    gap: 12px;
    margin-top: 10px;
  }

  /* ---- Power Icons HUD ---- */
  #powerIcons {
    position: absolute;
    top: 32px;
    left: 16px;
    display: none;
    gap: 8px;
    z-index: 10;
  }

  .power-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: rgba(0,0,0,0.35);
    border: 2px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.4;
    transition: opacity 0.3s, border-color 0.3s, box-shadow 0.3s;
  }

  .power-icon.active {
    opacity: 1;
    border-color: #ce93d8;
    box-shadow: 0 0 10px rgba(156,39,176,0.6);
    background: rgba(74,20,140,0.5);
  }

  .power-icon canvas {
    width: 28px;
    height: 28px;
  }

  /* ---- Progress Bar ---- */
  #progressBarContainer {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 18px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    z-index: 10;
    display: none;
    border: 2px solid rgba(255,255,255,0.4);
  }

  #progressBarFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ffd54f, #ff6f00);
    border-radius: 8px;
    transition: width 0.3s;
  }

  #progressLabel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  }

  #questionCounter {
    position: absolute;
    top: 8px;
    right: 16px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    z-index: 10;
    display: none;
  }

  #placeIndicator {
    position: absolute;
    top: 8px;
    left: 16px;
    color: #ffd54f;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    z-index: 10;
    display: none;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="600"></canvas>

  <!-- Title Screen -->
  <div id="titleScreen" class="screen active">
    <div class="title-car-container">
      <canvas id="titleCarCanvas" width="180" height="80"></canvas>
    </div>
    <h1>Cart Race</h1>
    <p class="subtitle">Answer questions. Race to the finish!</p>
    <button class="btn btn-primary" id="btnStart">Start</button>
  </div>

  <!-- Selection Screen -->
  <div id="selectScreen" class="screen">
    <h2>Set Up Your Race</h2>

    <div class="select-section">
      <h3>Category</h3>
      <div class="option-group" id="categoryGroup">
        <button class="option-btn selected" data-val="science">Science</button>
        <button class="option-btn" data-val="history">History</button>
        <button class="option-btn" data-val="math">Math</button>
        <button class="option-btn" data-val="mix">Mix</button>
      </div>
    </div>

    <div class="select-section">
      <h3>Car Color</h3>
      <div class="option-group" id="colorGroup">
        <button class="option-btn car-option selected" data-val="pink">
          <canvas class="carPreview" data-color="pink" width="80" height="50"></canvas>
        </button>
        <button class="option-btn car-option" data-val="purple">
          <canvas class="carPreview" data-color="purple" width="80" height="50"></canvas>
        </button>
        <button class="option-btn car-option" data-val="blue">
          <canvas class="carPreview" data-color="blue" width="80" height="50"></canvas>
        </button>
        <button class="option-btn car-option" data-val="green">
          <canvas class="carPreview" data-color="green" width="80" height="50"></canvas>
        </button>
      </div>
    </div>

    <div class="select-section">
      <h3>Driver</h3>
      <div class="option-group" id="driverGroup">
        <button class="option-btn driver-option selected" data-val="0">
          <canvas class="driverPreview" data-driver="0" width="70" height="70"></canvas>
        </button>
        <button class="option-btn driver-option" data-val="1">
          <canvas class="driverPreview" data-driver="1" width="70" height="70"></canvas>
        </button>
        <button class="option-btn driver-option" data-val="2">
          <canvas class="driverPreview" data-driver="2" width="70" height="70"></canvas>
        </button>
        <button class="option-btn driver-option" data-val="3">
          <canvas class="driverPreview" data-driver="3" width="70" height="70"></canvas>
        </button>
      </div>
    </div>

    <div class="select-section">
      <h3>Level</h3>
      <div class="option-group" id="levelGroup">
        <button class="option-btn selected" data-val="1">Level 1 (K)</button>
        <button class="option-btn" data-val="2">Level 2 (1st)</button>
        <button class="option-btn" data-val="3">Level 3 (2nd)</button>
        <button class="option-btn" data-val="4">Level 4 (3rd)</button>
        <button class="option-btn" data-val="5">Level 5 (4th)</button>
        <button class="option-btn" data-val="6">Level 6 (5th)</button>
      </div>
    </div>

    <button class="btn btn-green" id="btnRace" style="margin-top: 10px;">Race!</button>
  </div>

  <!-- Question Overlay -->
  <div id="questionOverlay">
    <div class="question-box">
      <div class="boost-label" id="boostLabel">Boost Question!</div>
      <div class="q-text" id="qText"></div>
      <div id="answersContainer"></div>
      <div class="result-text" id="resultText"></div>
    </div>
  </div>

  <!-- Finish Screen -->
  <div id="finishScreen" class="screen">
    <canvas id="finishCanvas" width="900" height="340"></canvas>
    <h2 id="finishTitle"></h2>
    <div id="finishStats" style="color:#fff;font-size:18px;margin-bottom:2px;"></div>
    <div id="finishPoints"></div>
    <div class="finish-buttons">
      <button class="btn btn-green" id="btnRaceAgain">Race Again</button>
      <button class="btn btn-primary" id="btnNextLevel" style="display:none;">Next Level</button>
      <button class="btn btn-blue" id="btnPrizes">Prizes</button>
      <button class="btn btn-blue" id="btnMainMenu">Main Menu</button>
    </div>
  </div>

  <!-- Prize Screen -->
  <div id="prizeScreen" class="screen">
    <h2>Prize Shop</h2>
    <div class="prize-total" id="prizeTotalPoints"></div>
    <div class="prize-list" id="prizeList"></div>
    <div class="prize-bin-label">My Prizes</div>
    <div class="prize-bin" id="prizeBin"></div>
    <div class="prize-buttons">
      <button class="btn btn-green" id="btnPrizeBack">Back</button>
      <button class="btn btn-primary" id="btnPrizeMainMenu">Main Menu</button>
    </div>
  </div>

  <!-- Redeem Confirmation Modal -->
  <div id="redeemModal">
    <div class="redeem-box">
      <h3>Redeem Prize?</h3>
      <div class="redeem-reward" id="redeemReward"></div>
      <p class="redeem-cost" id="redeemCost"></p>
      <div class="redeem-buttons">
        <button class="btn btn-green" id="btnRedeemYes">Yes!</button>
        <button class="btn btn-blue" id="btnRedeemNo">No</button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="progressBarContainer">
    <div id="progressBarFill"></div>
    <div id="progressLabel"></div>
  </div>
  <div id="questionCounter"></div>
  <div id="placeIndicator"></div>
  <div id="powerIcons">
    <div class="power-icon" id="powerDragon" title="Dragon Form">
      <canvas id="powerDragonCanvas" width="30" height="30"></canvas>
    </div>
    <div class="power-icon" id="powerInvisible" title="Invisible">
      <canvas id="powerInvisibleCanvas" width="30" height="30"></canvas>
    </div>
  </div>
</div>

<script>
// roundRect polyfill for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
    if (typeof radii === 'number') radii = [radii, radii, radii, radii];
    if (Array.isArray(radii)) {
      while (radii.length < 4) radii.push(radii[radii.length - 1] || 0);
    }
    const [tl, tr, br, bl] = radii;
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
    return this;
  };
}

      { question: "What falls from clouds when it rains?", choices: ["Water", "Milk", "Juice", "Sand"], correct: 0 },
      { question: "How many legs does a dog have?", choices: ["4", "2", "6", "8"], correct: 0 },
      { question: "Which is a fruit?", choices: ["Apple", "Bread", "Cheese", "Rice"], correct: 0 },
      { question: "What gives us light during the day?", choices: ["The Sun", "The Moon", "A Lamp", "Stars"], correct: 0 },
      { question: "What do fish live in?", choices: ["Water", "Sand", "Trees", "Clouds"], correct: 0 },
      { question: "Which season is cold and snowy?", choices: ["Winter", "Summer", "Spring", "Fall"], correct: 0 },
      { question: "What body part do we use to see?", choices: ["Eyes", "Ears", "Nose", "Mouth"], correct: 0 },
      { question: "What color are most leaves?", choices: ["Green", "Blue", "Red", "White"], correct: 0 },
      { question: "Which animal can fly?", choices: ["Bird", "Fish", "Dog", "Cat"], correct: 0 },

// ============================================================
//  UTILITY FUNCTIONS
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function getPlaceSuffix(p) {
  if (p === 1) return 'st';
  if (p === 2) return 'nd';
  if (p === 3) return 'rd';
  return 'th';
}

// ============================================================
function loadQuestions() {
  let pool;
  if (selectedCategory === 'mix') {
    pool = [
      ...QUESTIONS.science[selectedLevel],
      ...QUESTIONS.history[selectedLevel],
      ...QUESTIONS.math[selectedLevel],
    ];
  } else {
    pool = [...QUESTIONS[selectedCategory][selectedLevel]];
  }
  // Shuffle and pick 10
  const shuffled = shuffle(pool);
  questionQueue = shuffled.slice(0, 10).map(q => {
    // Shuffle answers but track the correct one
    const indices = [0, 1, 2, 3];
    const shuffledIndices = shuffle(indices);
    const newCorrect = shuffledIndices.indexOf(q.correct);
    return {
      question: q.question,
      choices: shuffledIndices.map(i => q.choices[i]),
      correct: newCorrect
    };
  });
}

  // Set label based on boost type
  const label = document.getElementById('boostLabel');
  if (currentBoostType === 'dragon') {
    label.textContent = 'Dragon Power!';
    label.style.color = '#9c27b0';
  } else if (currentBoostType === 'invisible') {
    label.textContent = 'Invisible Power!';
    label.style.color = '#9c27b0';
  } else {
    label.textContent = 'Boost Question!';
    label.style.color = '#ff6f00';
  }

  q.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.textContent = choice;
    btn.addEventListener('click', () => handleAnswer(i, q.correct));
    container.appendChild(btn);
  });

  document.getElementById('questionOverlay').classList.add('active');
  questionActive = true;
}

function handleAnswer(selected, correct) {
  const btns = document.querySelectorAll('.answer-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    if (i === selected && i !== correct) btn.classList.add('wrong');
  });

  const isCorrect = selected === correct;
  const resultEl = document.getElementById('resultText');

  if (isCorrect) {
    correctAnswers++;
    if (currentBoostType === 'dragon') {
      resultEl.style.color = '#7b1fa2';
      resultEl.textContent = 'Dragon Form activated!';
      powerDragon = true;
      dragonTimer = POWER_DURATION;
      document.getElementById('powerDragon').classList.add('active');
      playerCar.speedBoost = 3.5;
      playerCar.boostTimer = 120;
    } else if (currentBoostType === 'invisible') {
      resultEl.style.color = '#7b1fa2';
      resultEl.textContent = 'Invisible Mode activated!';
      powerInvisible = true;
      invisibleTimer = POWER_DURATION;
      document.getElementById('powerInvisible').classList.add('active');
      playerCar.speedBoost = 3.5;
      playerCar.boostTimer = 120;
    } else {
      resultEl.style.color = '#2e7d32';
      resultEl.textContent = 'Correct! Speed Boost!';
      playerCar.speedBoost = 3.5;
      playerCar.boostTimer = 120;
    }
  } else {
    resultEl.style.color = '#c62828';
    resultEl.textContent = 'Not quite! Slowing down...';
    playerCar.speedBoost = -1.5;
    playerCar.boostTimer = 90;
  }

  currentBoostType = 'normal';
  questionsAsked++;
  updateHUD();

  setTimeout(() => {
    document.getElementById('questionOverlay').classList.remove('active');
    questionActive = false;
  }, 1400);
}

// ============================================================
//  CAR DRAWING
// ============================================================
// driverIdx: index into DRIVERS array, -1 = no driver
function drawCar(ctx, x, y, w, h, color, isPlayer, facingRight, driverIdx) {
  const c = CAR_COLORS[color] || { body: color, dark: color, light: color };
  const bodyColor = c.body || color;
  const darkColor = c.dark || color;
  const lightColor = c.light || color;
  const isColorObj = !!c.body;
  if (driverIdx === undefined) driverIdx = -1;

  ctx.save();
  ctx.translate(x, y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(w / 2, h + 2, w / 2 - 4, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.roundRect(0, h * 0.3, w, h * 0.55, 8);
  ctx.fill();

  // Roof / cabin
  ctx.fillStyle = isColorObj ? darkColor : bodyColor;
  ctx.beginPath();
  if (facingRight !== false) {
    ctx.roundRect(w * 0.35, h * 0.05, w * 0.40, h * 0.35, [8, 8, 0, 0]);
  } else {
    ctx.roundRect(w * 0.25, h * 0.05, w * 0.40, h * 0.35, [8, 8, 0, 0]);
  }
  ctx.fill();

  // Window
  ctx.fillStyle = '#b3e5fc';
  let winX, winY, winW, winH;
  if (facingRight !== false) {
    winX = w * 0.40; winY = h * 0.10; winW = w * 0.30; winH = h * 0.22;
  } else {
    winX = w * 0.30; winY = h * 0.10; winW = w * 0.30; winH = h * 0.22;
  }
  ctx.fillRect(winX, winY, winW, winH);

  // Draw driver in window
  if (driverIdx >= 0 && driverIdx < DRIVERS.length) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(winX, winY, winW, winH);
    ctx.clip();
    const headR = Math.min(winW, winH) * 0.45;
    const headCX = winX + winW * 0.48;
    const headCY = winY + winH * 0.65;
    drawDriverHead(ctx, headCX, headCY, headR, driverIdx);
    ctx.restore();
  }

  // Headlight
  ctx.fillStyle = '#fff9c4';
  if (facingRight !== false) {
    ctx.beginPath();
    ctx.arc(w - 3, h * 0.52, 4, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(3, h * 0.52, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Taillight
  ctx.fillStyle = '#ef5350';
  if (facingRight !== false) {
    ctx.beginPath();
    ctx.arc(3, h * 0.52, 3, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(w - 3, h * 0.52, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Bumper line
  ctx.strokeStyle = isColorObj ? darkColor : '#555';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(4, h * 0.83);
  ctx.lineTo(w - 4, h * 0.83);
  ctx.stroke();

  // Wheels
  const wheelR = h * 0.20;
  const wheelY = h * 0.85;
  [w * 0.22, w * 0.78].forEach(wx => {
    ctx.fillStyle = '#37474f';
    ctx.beginPath();
    ctx.arc(wx, wheelY, wheelR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#78909c';
    ctx.beginPath();
    ctx.arc(wx, wheelY, wheelR * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Player star indicator
  if (isPlayer) {
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('★', w / 2, h * 0.02);
  }

  ctx.restore();
}

function drawCarPreview(cvs, color) {
  const c = cvs.getContext('2d');
  c.clearRect(0, 0, cvs.width, cvs.height);
  drawCar(c, 5, 5, 70, 35, color, false, true, -1);
}

// ============================================================
//  DRIVER DRAWING
// ============================================================
// Draw a driver head+hat. cx,cy = center of head, r = head radius
function drawDriverHead(ctx, cx, cy, r, driverIdx, hatColorOverride) {
  const drv = DRIVERS[driverIdx] || DRIVERS[0];
  const hatKey = hatColorOverride || drv.hatColor;
  const hatCol = CAR_COLORS[hatKey] || CAR_COLORS.pink;

  ctx.save();

  // Ears
  ctx.fillStyle = drv.skin;
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.9, cy + r * 0.05, r * 0.22, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.9, cy + r * 0.05, r * 0.22, r * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head circle
  ctx.fillStyle = drv.skin;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  const eyeY = cy - r * 0.1;
  const eyeSpread = r * 0.35;
  const eyeR = r * 0.16;

  // Eye whites
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(cx - eyeSpread, eyeY, eyeR * 1.3, eyeR * 1.1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + eyeSpread, eyeY, eyeR * 1.3, eyeR * 1.1, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pupils
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(cx - eyeSpread + eyeR * 0.2, eyeY, eyeR * 0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + eyeSpread + eyeR * 0.2, eyeY, eyeR * 0.7, 0, Math.PI * 2);
  ctx.fill();

  // Eyebrows
  ctx.strokeStyle = drv.hair;
  ctx.lineWidth = Math.max(1, r * 0.12);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - eyeSpread - eyeR, eyeY - eyeR * 1.8);
  ctx.lineTo(cx - eyeSpread + eyeR, eyeY - eyeR * 1.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + eyeSpread - eyeR, eyeY - eyeR * 1.5);
  ctx.lineTo(cx + eyeSpread + eyeR, eyeY - eyeR * 1.8);
  ctx.stroke();

  // Smile
  ctx.strokeStyle = '#6d4c41';
  ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.15, r * 0.35, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // Nose
  ctx.fillStyle = drv.skin;
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = Math.max(0.5, r * 0.06);
  ctx.beginPath();
  ctx.arc(cx, cy + r * 0.05, r * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Hat — baseball cap style
  // Hat dome
  ctx.fillStyle = hatCol.body;
  ctx.beginPath();
  ctx.arc(cx, cy - r * 0.35, r * 0.95, Math.PI, 0);
  ctx.fill();

  // Hat band
  ctx.fillStyle = hatCol.dark;
  ctx.fillRect(cx - r * 0.95, cy - r * 0.38, r * 1.9, r * 0.18);

  // Hat brim — extends to the right (facing right)
  ctx.fillStyle = hatCol.dark;
  ctx.beginPath();
  ctx.ellipse(cx + r * 0.15, cy - r * 0.32, r * 1.15, r * 0.18, 0.1, -Math.PI * 0.1, Math.PI * 1.1);
  ctx.fill();

  // Hat button on top
  ctx.fillStyle = hatCol.light;
  ctx.beginPath();
  ctx.arc(cx, cy - r * 1.2, r * 0.12, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawDriverPreview(cvs, driverIdx) {
  const c = cvs.getContext('2d');
  c.clearRect(0, 0, cvs.width, cvs.height);
  drawDriverHead(c, 35, 40, 22, driverIdx);
}

// ============================================================
//  SCENERY
// ============================================================
function generateScenery() {
  clouds = [];
  for (let i = 0; i < 30; i++) {
    clouds.push({
      x: Math.random() * (TRACK_LENGTH + CANVAS_W),
      y: 20 + Math.random() * 120,
      w: 60 + Math.random() * 80,
      speed: 0.1 + Math.random() * 0.2
    });
  }
  hills = [];
  for (let i = 0; i < 20; i++) {
    hills.push({
      x: i * 500 + Math.random() * 200,
      w: 200 + Math.random() * 200,
      h: 40 + Math.random() * 60,
      color: `hsl(${100 + Math.random() * 30}, ${50 + Math.random() * 20}%, ${40 + Math.random() * 15}%)`
    });
  }
  trees = [];
  for (let i = 0; i < 50; i++) {
    trees.push({
      x: 100 + Math.random() * (TRACK_LENGTH + 200),
      side: Math.random() < 0.5 ? 'top' : 'bottom',
      h: 25 + Math.random() * 30,
      color: `hsl(${110 + Math.random() * 30}, ${55 + Math.random() * 20}%, ${30 + Math.random() * 15}%)`
    });
  }
}

function drawBackground(dt) {
  // Sky
  const skyGrad = ctx.createLinearGradient(0, 0, 0, ROAD_Y);
  skyGrad.addColorStop(0, '#4fc3f7');
  skyGrad.addColorStop(1, '#81d4fa');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, CANVAS_W, ROAD_Y);

  // Hills
  hills.forEach(h => {
    const sx = h.x - cameraX * 0.4;
    if (sx > -h.w && sx < CANVAS_W + h.w) {
      ctx.fillStyle = h.color;
      ctx.beginPath();
      ctx.ellipse(sx, ROAD_Y, h.w / 2, h.h, 0, Math.PI, 0);
      ctx.fill();
    }
  });

  // Clouds
  clouds.forEach(c => {
    c.x -= c.speed * dt * 0.06;
    let sx = c.x - cameraX * 0.15;
    // Wrap clouds
    if (sx < -c.w) {
      c.x += TRACK_LENGTH + CANVAS_W + c.w * 2;
    }
    sx = c.x - cameraX * 0.15;
    if (sx > -c.w && sx < CANVAS_W + c.w) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.ellipse(sx, c.y, c.w / 2, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(sx - c.w * 0.2, c.y + 5, c.w * 0.3, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(sx + c.w * 0.25, c.y + 3, c.w * 0.25, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Grass above road
  ctx.fillStyle = '#66bb6a';
  ctx.fillRect(0, ROAD_Y - 10, CANVAS_W, 10);

  // Road
  ctx.fillStyle = '#546e7a';
  ctx.fillRect(0, ROAD_Y, CANVAS_W, ROAD_H);

  // Road top/bottom edges
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, ROAD_Y, CANVAS_W, 3);
  ctx.fillRect(0, ROAD_Y + ROAD_H - 3, CANVAS_W, 3);

  // Lane dashes
  for (let lane = 1; lane < 4; lane++) {
    const ly = ROAD_Y + lane * LANE_H;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -cameraX * 0.3;
    ctx.beginPath();
    ctx.moveTo(0, ly);
    ctx.lineTo(CANVAS_W, ly);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Grass below road
  ctx.fillStyle = '#66bb6a';
  ctx.fillRect(0, ROAD_Y + ROAD_H, CANVAS_W, CANVAS_H - ROAD_Y - ROAD_H);

  // Trees
  trees.forEach(t => {
    const sx = t.x - cameraX * 0.7;
    if (sx > -30 && sx < CANVAS_W + 30) {
      const ty = t.side === 'top' ? ROAD_Y - 15 : ROAD_Y + ROAD_H + 5;
      // Trunk
      ctx.fillStyle = '#795548';
      ctx.fillRect(sx - 3, ty - t.h * 0.4, 6, t.h * 0.4);
      // Foliage
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.arc(sx, ty - t.h * 0.5, t.h * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sx - t.h * 0.2, ty - t.h * 0.35, t.h * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sx + t.h * 0.2, ty - t.h * 0.35, t.h * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Finish line
  const finishX = TRACK_LENGTH - cameraX;
  if (finishX > -40 && finishX < CANVAS_W + 40) {
    const checkerSize = 12;
    for (let row = 0; row < Math.ceil(ROAD_H / checkerSize); row++) {
      for (let col = 0; col < 3; col++) {
        ctx.fillStyle = (row + col) % 2 === 0 ? '#fff' : '#222';
        ctx.fillRect(
          finishX + col * checkerSize,
          ROAD_Y + row * checkerSize,
          checkerSize,
          checkerSize
        );
      }
    }
  }
}

// ============================================================
//  BOOST ICON DRAWING
// ============================================================
function drawBoostIcon(x, y, time) {
  const bc = BOOST_COLORS[selectedLevel] || BOOST_COLORS[1];
  const pulse = Math.sin(time * 0.005) * 3;
  const r = 16 + pulse;

  // Glow
  ctx.save();
  ctx.shadowColor = bc.glow;
  ctx.shadowBlur = 15 + pulse;
  ctx.fillStyle = bc.outer;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Inner
  ctx.fillStyle = bc.inner;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.65, 0, Math.PI * 2);
  ctx.fill();

  // Lightning bolt
  ctx.fillStyle = bc.bolt;
  ctx.beginPath();
  ctx.moveTo(x - 4, y - 8);
  ctx.lineTo(x + 2, y - 1);
  ctx.lineTo(x - 1, y + 0);
  ctx.lineTo(x + 5, y + 9);
  ctx.lineTo(x - 2, y + 1);
  ctx.lineTo(x + 1, y + 0);
  ctx.closePath();
  ctx.fill();
}

// ============================================================
//  RACE SETUP & LOGIC
// ============================================================
function initRace() {
  raceTime = 0;
  cameraX = 0;
  questionsAsked = 0;
  correctAnswers = 0;
  currentBoost = 0;
  questionActive = false;
  raceFinished = false;
  playerPlace = 1;

  playerCar = {
    x: 50,
    lane: 0,
    baseSpeed: 2.2,
    speed: 2.2,
    speedBoost: 0,
    boostTimer: 0,
    isPlayer: true,
    color: selectedColor,
    driverIdx: selectedDriver
  };

  // Assign AI drivers — pick from drivers the player didn't choose
  const aiDriverPool = [0, 1, 2, 3].filter(d => d !== selectedDriver);
  aiCars = [];
  const aiSpeeds = [1.9, 2.1, 2.0];
  for (let i = 0; i < 3; i++) {
    aiCars.push({
      x: 50 + Math.random() * 20 - 10,
      lane: i + 1,
      baseSpeed: aiSpeeds[i],
      speed: aiSpeeds[i],
      speedBoost: 0,
      boostTimer: 0,
      isPlayer: false,
      color: AI_COLORS[i],
      driverIdx: aiDriverPool[i],
      wobbleTimer: Math.random() * 1000,
      burstCooldown: 0
    });
  }

  boosts = [];
  for (let i = 0; i < NUM_BOOSTS; i++) {
    boosts.push({
      x: BOOST_SPACING * (i + 1),
      collected: false,
      type: 'normal'   // 'normal', 'dragon', or 'invisible'
    });
  }

  // For level 2+, make boost #3 a dragon power and #7 an invisible power
  if (selectedLevel >= 2) {
    boosts[2].type = 'dragon';
    boosts[6].type = 'invisible';
  }

  // Reset special powers
  powerDragon = false;
  powerInvisible = false;
  dragonTimer = 0;
  invisibleTimer = 0;
  currentBoostType = 'normal';

  generateScenery();
  loadQuestions();

  document.getElementById('progressBarContainer').style.display = 'block';
  document.getElementById('questionCounter').style.display = 'block';
  document.getElementById('placeIndicator').style.display = 'block';
  // Show power icons for level 2+
  const powerIconsEl = document.getElementById('powerIcons');
  powerIconsEl.style.display = selectedLevel >= 2 ? 'flex' : 'none';
  document.getElementById('powerDragon').classList.remove('active');
  document.getElementById('powerInvisible').classList.remove('active');
  drawPowerIcons();
  updateHUD();
}

function updateHUD() {
  const progress = clamp(playerCar.x / TRACK_LENGTH * 100, 0, 100);
  document.getElementById('progressBarFill').style.width = progress + '%';
  document.getElementById('progressLabel').textContent = Math.round(progress) + '%';
  document.getElementById('questionCounter').textContent = `Score: ${correctAnswers}/${questionsAsked}`;

  const place = getPlayerPlace();
  document.getElementById('placeIndicator').textContent = `${place}${getPlaceSuffix(place)} Place`;
}

function getPlayerPlace() {
  let place = 1;
  const allCars = [playerCar, ...aiCars];
  allCars.forEach(c => {
    if (c !== playerCar && c.x > playerCar.x) place++;
  });
  return place;
}

function updateRace(dt) {
  if (questionActive || raceFinished) return;

  raceTime += dt;

  // Update player car
  if (playerCar.boostTimer > 0) {
    playerCar.boostTimer -= 1;
    playerCar.speed = playerCar.baseSpeed + playerCar.speedBoost;
    if (playerCar.boostTimer <= 0) {
      playerCar.speed = playerCar.baseSpeed;
      playerCar.speedBoost = 0;
    }
  }
  playerCar.x += playerCar.speed * (dt / 16);

  // Update AI cars
  aiCars.forEach((ai, i) => {
    ai.wobbleTimer += dt;
    ai.burstCooldown -= dt;

    // AI speed variation
    const wobble = Math.sin(ai.wobbleTimer * 0.002) * 0.3;
    let aiSpeed = ai.baseSpeed + wobble;

    // Random bursts to keep race exciting
    if (ai.burstCooldown <= 0 && Math.random() < 0.003) {
      ai.speedBoost = 1.2 + Math.random() * 0.8;
      ai.boostTimer = 60 + Math.random() * 60;
      ai.burstCooldown = 2000 + Math.random() * 3000;
    }

    if (ai.boostTimer > 0) {
      ai.boostTimer -= 1;
      aiSpeed += ai.speedBoost;
      if (ai.boostTimer <= 0) ai.speedBoost = 0;
    }

    // Rubber-banding: AI slows if too far ahead, speeds up if too far behind
    const diff = ai.x - playerCar.x;
    if (diff > 400) aiSpeed *= 0.85;
    else if (diff < -400) aiSpeed *= 1.15;

    // Must answer 7+ correctly to win: lead AI stays ahead if player
    // hasn't answered enough questions correctly
    const progress = playerCar.x / TRACK_LENGTH;
    if (progress > 0.3 && correctAnswers < 7) {
      const urgency = Math.min((progress - 0.3) / 0.4, 1);   // ramps 0→1
      const deficit = (7 - correctAnswers) / 7;               // how far short
      if (i === 0) {
        aiSpeed += 3.0 * urgency * deficit;                   // lead AI surges
        // If lead AI falls behind player, give extra catch-up
        if (ai.x < playerCar.x) aiSpeed += 2.0 * urgency;
      } else {
        aiSpeed += 1.0 * urgency * deficit;
      }
    }

    ai.speed = aiSpeed;
    ai.x += ai.speed * (dt / 16);
  });

  // Camera follows player
  cameraX = playerCar.x - 200;
  if (cameraX < 0) cameraX = 0;

  // Check boost collision
  if (currentBoost < NUM_BOOSTS) {
    const boost = boosts[currentBoost];
    if (!boost.collected && playerCar.x >= boost.x - 40) {
      boost.collected = true;
      currentBoostType = boost.type;
      currentBoost++;
      showQuestion();
    }
  }

  // Update special power timers
  if (dragonTimer > 0) {
    dragonTimer--;
    if (dragonTimer <= 0) {
      powerDragon = false;
      document.getElementById('powerDragon').classList.remove('active');
    }
  }
  if (invisibleTimer > 0) {
    invisibleTimer--;
    if (invisibleTimer <= 0) {
      powerInvisible = false;
      document.getElementById('powerInvisible').classList.remove('active');
    }
  }

  // Check finish
  if (!raceFinished) {
    const allCarsArr = [playerCar, ...aiCars];
    const anyFinished = allCarsArr.some(c => c.x >= TRACK_LENGTH);
    if (anyFinished) {
      const allDone = allCarsArr.every(c => c.x >= TRACK_LENGTH - 100) || playerCar.x >= TRACK_LENGTH;
      if (allDone || playerCar.x >= TRACK_LENGTH) {
        // If player hasn't answered 7+ correctly, ensure lead AI finishes ahead
        if (correctAnswers < 7) {
          const leadAI = aiCars[0];
          if (leadAI.x <= playerCar.x) {
            leadAI.x = playerCar.x + 30;
          }
        }
        raceFinished = true;
        playerPlace = getPlayerPlace();
        setTimeout(() => showFinish(), 600);
      }
    }
  }

  updateHUD();
}

function drawRace() {
  drawBackground(16);

  // Draw boosts
  boosts.forEach((b, i) => {
    if (!b.collected) {
      const sx = b.x - cameraX;
      if (sx > -30 && sx < CANVAS_W + 30) {
        const by = ROAD_Y + playerCar.lane * LANE_H + LANE_H / 2;
        if (b.type === 'dragon' || b.type === 'invisible') {
          drawSpecialBoostIcon(sx, by, raceTime, b.type);
        } else {
          drawBoostIcon(sx, by, raceTime);
        }
      }
    }
  });

  // Draw all cars sorted by lane for layering
  const allCars = [playerCar, ...aiCars];
  allCars.sort((a, b) => a.lane - b.lane);
  allCars.forEach(car => {
    const sx = car.x - cameraX;
    const sy = ROAD_Y + car.lane * LANE_H + (LANE_H - CAR_H) / 2;
    if (sx > -CAR_W - 10 && sx < CANVAS_W + 10) {
      // Boost trail effect
      if (car.boostTimer > 0 && car.speedBoost > 0) {
        ctx.save();
        ctx.globalAlpha = 0.4;
        for (let i = 1; i <= 5; i++) {
          ctx.globalAlpha = 0.3 - i * 0.05;
          ctx.fillStyle = powerDragon && car.isPlayer ? '#ce93d8' : '#ffd54f';
          ctx.beginPath();
          ctx.ellipse(sx - i * 12, sy + CAR_H / 2, 8, 5 + i, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
      // Slow trail effect
      if (car.boostTimer > 0 && car.speedBoost < 0) {
        ctx.save();
        for (let i = 1; i <= 3; i++) {
          ctx.globalAlpha = 0.2;
          ctx.fillStyle = '#ef5350';
          ctx.beginPath();
          ctx.ellipse(sx + CAR_W + i * 8, sy + CAR_H / 2, 6, 4, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Choose how to draw the player car based on active powers
      if (car.isPlayer && powerDragon) {
        drawRaceDragon(ctx, sx, sy, CAR_W, CAR_H, raceTime);
      } else if (car.isPlayer && powerInvisible) {
        drawInvisibleCar(ctx, sx, sy, CAR_W, CAR_H, car.color, car.driverIdx);
      } else {
        drawCar(ctx, sx, sy, CAR_W, CAR_H, car.color, car.isPlayer, true, car.driverIdx);
      }
    }
  });
}

// ============================================================
//  SPECIAL BOOST ICON (purple)
// ============================================================
function drawSpecialBoostIcon(x, y, time, type) {
  const pulse = Math.sin(time * 0.005) * 3;
  const r = 18 + pulse;

  // Purple glow
  ctx.save();
  ctx.shadowColor = '#ce93d8';
  ctx.shadowBlur = 18 + pulse;
  ctx.fillStyle = '#7b1fa2';
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Inner ring
  ctx.fillStyle = '#ce93d8';
  ctx.beginPath();
  ctx.arc(x, y, r * 0.65, 0, Math.PI * 2);
  ctx.fill();

  // Icon in center
  ctx.fillStyle = '#4a148c';
  if (type === 'dragon') {
    // Small dragon silhouette — wings + body
    ctx.beginPath();
    ctx.moveTo(x, y - 6);
    ctx.lineTo(x - 7, y - 3);
    ctx.lineTo(x - 4, y + 1);
    ctx.lineTo(x - 2, y + 5);
    ctx.lineTo(x + 2, y + 5);
    ctx.lineTo(x + 4, y + 1);
    ctx.lineTo(x + 7, y - 3);
    ctx.closePath();
    ctx.fill();
    // Small horns
    ctx.beginPath();
    ctx.moveTo(x - 2, y - 6);
    ctx.lineTo(x - 3, y - 9);
    ctx.lineTo(x, y - 6);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 2, y - 6);
    ctx.lineTo(x + 3, y - 9);
    ctx.lineTo(x, y - 6);
    ctx.fill();
  } else {
    // Ghost / invisible icon — dashed circle with question mark
    ctx.strokeStyle = '#4a148c';
    ctx.lineWidth = 2;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // Eye dots
    ctx.fillStyle = '#4a148c';
    ctx.beginPath();
    ctx.arc(x - 2, y - 1, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 2, y - 1, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ============================================================
//  RACE DRAGON (car shape-shifted into dragon)
// ============================================================
function drawRaceDragon(ctx, x, y, w, h, time) {
  ctx.save();
  const cx = x + w / 2;
  const cy = y + h / 2;

  const wingFlap = Math.sin(time * 0.008) * 8;

  // Purple trail
  ctx.globalAlpha = 0.25;
  for (let i = 1; i <= 4; i++) {
    ctx.fillStyle = '#ce93d8';
    ctx.beginPath();
    ctx.ellipse(cx - w * 0.35 - i * 10, cy, 6, 4 + i, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Wings
  ctx.fillStyle = '#7b1fa2';
  ctx.beginPath();
  ctx.moveTo(cx - 5, cy - 6);
  ctx.lineTo(cx - 15, cy - 22 + wingFlap);
  ctx.lineTo(cx + 5, cy - 8);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx - 5, cy + 6);
  ctx.lineTo(cx - 15, cy + 22 - wingFlap);
  ctx.lineTo(cx + 5, cy + 8);
  ctx.closePath();
  ctx.fill();

  // Body
  ctx.fillStyle = '#8e24aa';
  ctx.beginPath();
  ctx.ellipse(cx, cy, w * 0.35, h * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = '#ce93d8';
  ctx.beginPath();
  ctx.ellipse(cx + 3, cy, w * 0.18, h * 0.22, 0, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.fillStyle = '#7b1fa2';
  ctx.beginPath();
  ctx.ellipse(cx + w * 0.32, cy, h * 0.30, h * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = '#fff176';
  ctx.beginPath();
  ctx.ellipse(cx + w * 0.36, cy - 4, 3, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#b71c1c';
  ctx.beginPath();
  ctx.ellipse(cx + w * 0.36, cy - 4, 1.2, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Horns
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  ctx.moveTo(cx + w * 0.30, cy - 9);
  ctx.lineTo(cx + w * 0.28, cy - 16);
  ctx.lineTo(cx + w * 0.34, cy - 8);
  ctx.closePath();
  ctx.fill();

  // Flame
  const fl = 8 + Math.sin(time * 0.015) * 5;
  ctx.fillStyle = '#ff6f00';
  ctx.beginPath();
  ctx.moveTo(cx + w * 0.42, cy - 1);
  ctx.lineTo(cx + w * 0.42 + fl, cy - 3);
  ctx.lineTo(cx + w * 0.42, cy + 1);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  ctx.moveTo(cx + w * 0.42, cy);
  ctx.lineTo(cx + w * 0.42 + fl * 0.5, cy - 1);
  ctx.lineTo(cx + w * 0.42, cy + 0.5);
  ctx.closePath();
  ctx.fill();

  // Tail
  ctx.strokeStyle = '#8e24aa';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.35, cy);
  ctx.quadraticCurveTo(cx - w * 0.45, cy + 6, cx - w * 0.48, cy + 2);
  ctx.stroke();

  // Tail spike
  ctx.fillStyle = '#ff6f00';
  ctx.beginPath();
  ctx.moveTo(cx - w * 0.48, cy + 2);
  ctx.lineTo(cx - w * 0.53, cy - 2);
  ctx.lineTo(cx - w * 0.46, cy + 1);
  ctx.closePath();
  ctx.fill();

  // Player star
  ctx.fillStyle = '#ffd54f';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', cx, cy - h * 0.5);

  ctx.restore();
}

// ============================================================
//  INVISIBLE CAR (outline only)
// ============================================================
function drawInvisibleCar(ctx, x, y, w, h, color, driverIdx) {
  const c = CAR_COLORS[color] || { body: color, dark: color };
  const outlineColor = c.dark || color;

  ctx.save();
  ctx.translate(x, y);

  // Ghostly shimmer
  const shimmer = 0.15 + Math.sin(raceTime * 0.008) * 0.08;
  ctx.globalAlpha = shimmer;
  ctx.fillStyle = c.body || color;
  ctx.beginPath();
  ctx.roundRect(0, h * 0.3, w, h * 0.55, 8);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Body outline
  ctx.strokeStyle = outlineColor;
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.roundRect(0, h * 0.3, w, h * 0.55, 8);
  ctx.stroke();

  // Cabin outline
  ctx.beginPath();
  ctx.roundRect(w * 0.35, h * 0.05, w * 0.40, h * 0.35, [8, 8, 0, 0]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Wheel outlines
  const wheelR = h * 0.20;
  const wheelY = h * 0.85;
  ctx.strokeStyle = outlineColor;
  ctx.lineWidth = 1.5;
  [w * 0.22, w * 0.78].forEach(wx => {
    ctx.beginPath();
    ctx.arc(wx, wheelY, wheelR, 0, Math.PI * 2);
    ctx.stroke();
  });

  // Ghost driver silhouette
  if (driverIdx >= 0) {
    const drv = DRIVERS[driverIdx] || DRIVERS[0];
    const headR = Math.min(w * 0.30, h * 0.22) * 0.45;
    const headCX = w * 0.40 + w * 0.30 * 0.48;
    const headCY = h * 0.10 + h * 0.22 * 0.65;
    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = outlineColor;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(headCX, headCY, headR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // Player star
  ctx.fillStyle = '#ffd54f';
  ctx.globalAlpha = 0.6;
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', w / 2, h * 0.02);

  ctx.restore();
}

  const wingFlap = Math.sin(time * 0.005) * 20;

  ctx.quadraticCurveTo(45, 75, 55, 95);

  ctx.fillStyle = '#ff6f00';

  ctx.moveTo(5, -42);
  ctx.lineTo(7, -33);
  ctx.lineTo(8, -42);

  ctx.ellipse(-10, -65, 8, 9, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(10, -65, 8, 9, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Slitted pupils
  ctx.fillStyle = '#b71c1c';
  ctx.beginPath();
  ctx.ellipse(-10, -65, 3, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(10, -65, 3, 7, 0, 0, Math.PI * 2);

  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-20, -70);

  ctx.beginPath();
  ctx.moveTo(20, -70);

  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(6, -47, 3, 2, 0, 0, Math.PI * 2);

  // Nostril smoke
  const smokeAlpha = (Math.sin(time * 0.004) + 1) * 0.15;
  ctx.fillStyle = `rgba(150,150,150,${smokeAlpha})`;
  ctx.beginPath();
  ctx.ellipse(-8, -52, 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(8, -53, 4, 3, 0, 0, Math.PI * 2);

  ctx.beginPath();
  ctx.moveTo(-14, -75);
  ctx.quadraticCurveTo(-25, -95, -20, -105);
  ctx.lineTo(-16, -100);
  ctx.quadraticCurveTo(-20, -88, -10, -74);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(14, -75);
  ctx.quadraticCurveTo(25, -95, 20, -105);
  ctx.lineTo(16, -100);
  ctx.quadraticCurveTo(20, -88, 10, -74);

  const clawFeet = [[-22, 70], [8, 70]];

  // FIRE BREATH — constant, big
  const flameTime = time * 0.012;
  const flameLen = 30 + Math.sin(flameTime) * 15 + Math.sin(flameTime * 2.3) * 8;
  const flameW = 10 + Math.sin(flameTime * 1.5) * 4;

  // Outer flame (red-orange)
  ctx.fillStyle = '#ff3d00';
  ctx.beginPath();
  ctx.moveTo(18, -45);
  ctx.quadraticCurveTo(30 + flameLen * 0.5, -55 - flameW, 25 + flameLen, -48);
  ctx.quadraticCurveTo(30 + flameLen * 0.5, -38 + flameW, 18, -42);
  ctx.closePath();
  ctx.fill();

  // Mid flame (orange)
  ctx.fillStyle = '#ff6f00';
  ctx.beginPath();
  ctx.moveTo(18, -44);
  ctx.quadraticCurveTo(25 + flameLen * 0.4, -52 - flameW * 0.5, 20 + flameLen * 0.75, -46);
  ctx.quadraticCurveTo(25 + flameLen * 0.4, -40 + flameW * 0.5, 18, -43);
  ctx.closePath();
  ctx.fill();

  // Inner flame (yellow-white)
  ctx.fillStyle = '#ffd54f';
  ctx.beginPath();
  ctx.moveTo(18, -44);
  ctx.quadraticCurveTo(22 + flameLen * 0.2, -48, 18 + flameLen * 0.4, -45);
  ctx.quadraticCurveTo(22 + flameLen * 0.2, -42, 18, -43);
  ctx.closePath();
  ctx.fill();

  // Ember particles
  ctx.fillStyle = '#ffab00';
  for (let i = 0; i < 5; i++) {
    const ex = 25 + Math.sin(flameTime + i * 2) * 20 + flameLen * 0.3;
    const ey = -46 + Math.cos(flameTime * 1.5 + i * 3) * 12;
    const er = 1.5 + Math.random() * 1.5;
    ctx.beginPath();
    ctx.arc(ex, ey, er, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// ============================================================
//  CONFETTI
// ============================================================
function spawnConfetti() {
  confettiParticles = [];
  const colors = ['#ff6f00', '#ffd54f', '#e91e63', '#4caf50', '#2196f3', '#9c27b0', '#ff5722'];
  for (let i = 0; i < 120; i++) {
    confettiParticles.push({
      x: Math.random() * CANVAS_W,
      y: -10 - Math.random() * 300,
      vx: (Math.random() - 0.5) * 3,
      vy: 1 + Math.random() * 3,
      size: 4 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.1
    });
  }
}

function updateConfetti(dt) {
  confettiParticles.forEach(p => {
    p.x += p.vx * (dt / 16);
    p.y += p.vy * (dt / 16);
    p.rot += p.rotSpeed;
    if (p.y > CANVAS_H + 20) {
      p.y = -10;
      p.x = Math.random() * CANVAS_W;
    }
  });
}

function drawConfetti() {
  confettiParticles.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  });
}

// ============================================================
//  SPEECH BUBBLE
// ============================================================
function drawSpeechBubble(ctx, x, y, w, h, text, text2) {
  ctx.save();

  // Bubble
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#9c27b0';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 16);
  ctx.fill();
  ctx.stroke();

  // Pointer
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#9c27b0';
  ctx.beginPath();
  ctx.moveTo(x - 12, y + h / 2 - 2);
  ctx.lineTo(x - 20, y + h / 2 + 18);
  ctx.lineTo(x + 5, y + h / 2 - 2);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Text
  ctx.fillStyle = '#4a148c';
  ctx.font = 'bold 16px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y - (text2 ? 10 : 0));
  if (text2) {
    ctx.font = '14px "Segoe UI", sans-serif';
    ctx.fillText(text2, x, y + 12);
  }

  ctx.restore();
}

// ============================================================
//  FINISH SCREEN
// ============================================================
function showFinish() {
  gameState = 'FINISH';
  hideHUD();

  // Award points: correct answers × level multiplier
  const earnedPoints = correctAnswers * selectedLevel;
  totalPoints += earnedPoints;
  saveTotalPoints(totalPoints);

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('finishScreen').classList.add('active');

  const placeText = `${playerPlace}${getPlaceSuffix(playerPlace)}`;
  document.getElementById('finishTitle').textContent =
    playerPlace === 1 ? 'You Won!' : `You Finished ${placeText}!`;
  document.getElementById('finishStats').textContent =
    `You got ${correctAnswers}/${questionsAsked} questions right!`;
  document.getElementById('finishPoints').textContent =
    `+${earnedPoints} points earned! (Total: ${totalPoints})`;

  // Show "Next Level" button if not already at max level
  const btnNext = document.getElementById('btnNextLevel');
  if (selectedLevel < 6) {
    btnNext.style.display = '';
    btnNext.textContent = `Next Level (Level ${selectedLevel + 1})`;
  } else {
    btnNext.style.display = 'none';
  }

  if (playerPlace <= 2) spawnConfetti();
  finishAnimTime = 0;
  drawFinishScreen();
}

function drawFinishScreen() {
  const finCanvas = document.getElementById('finishCanvas');
  const fctx = finCanvas.getContext('2d');
  finishAnimTime += 16;

  fctx.clearRect(0, 0, finCanvas.width, finCanvas.height);

  // Starry background
  fctx.fillStyle = 'transparent';
  fctx.fillRect(0, 0, finCanvas.width, finCanvas.height);

  // Scale based on place — bigger dragon overall
  const scales = { 1: 2.8, 2: 2.1, 3: 1.4, 4: 1.0 };
  const dragonScale = scales[playerPlace] || 1.0;

  // Dragon flies in from left — center vertically in canvas
  const targetX = finCanvas.width / 2 - 40;
  const dragonX = Math.min(targetX, finishAnimTime * 1.8 - 120);
  const dragonY = finCanvas.height / 2 + 30 * dragonScale;

  drawDragon(fctx, dragonX, dragonY, dragonScale, finishAnimTime);

  // Speech bubble
  if (finishAnimTime > 500) {
    const bubbleX = dragonX + 80 * dragonScale;
    const bubbleY = dragonY - 50 * dragonScale;
    const placeText = `You finished ${playerPlace}${getPlaceSuffix(playerPlace)} place!`;
    const scoreText = `${correctAnswers}/${questionsAsked} questions correct!`;
    drawSpeechBubble(fctx, bubbleX, bubbleY, 240, 60, placeText, scoreText);
  }

  // Confetti
  if (playerPlace <= 2) {
    updateConfetti(16);
    confettiParticles.forEach(p => {
      fctx.save();
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.fillStyle = p.color;
      fctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      fctx.restore();
    });
  }

  if (gameState === 'FINISH') {
    requestAnimationFrame(drawFinishScreen);
  }
}

// ============================================================
//  HUD HELPERS
// ============================================================
function hideHUD() {
  document.getElementById('progressBarContainer').style.display = 'none';
  document.getElementById('questionCounter').style.display = 'none';
  document.getElementById('placeIndicator').style.display = 'none';
  document.getElementById('powerIcons').style.display = 'none';
}

// ============================================================
//  TITLE SCREEN ANIMATION
// ============================================================
let titleAnimTime = 0;
function drawTitleCar() {
  const tc = document.getElementById('titleCarCanvas');
  const tctx = tc.getContext('2d');
  titleAnimTime += 16;

  tctx.clearRect(0, 0, tc.width, tc.height);

  // Bouncing car
  const bounce = Math.sin(titleAnimTime * 0.004) * 3;
  drawCar(tctx, 40, 15 + bounce, 100, 50, 'pink', false, true, 0);

  if (gameState === 'TITLE') {
    requestAnimationFrame(drawTitleCar);
  }
}

// ============================================================
//  MAIN GAME LOOP
// ============================================================
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min(timestamp - lastTime, 50);
  lastTime = timestamp;

  if (gameState === 'RACING') {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    updateRace(dt);
    drawRace();
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// ============================================================
//  SCREEN TRANSITIONS
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function startGame() {
  gameState = 'RACING';
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('questionOverlay').classList.remove('active');
  initRace();
}

// ============================================================
//  EVENT LISTENERS
// ============================================================
document.getElementById('btnStart').addEventListener('click', () => {
  gameState = 'SELECT';
  showScreen('selectScreen');
});

document.getElementById('btnRace').addEventListener('click', () => {
  startGame();
});

document.getElementById('btnRaceAgain').addEventListener('click', () => {
  startGame();
});

document.getElementById('btnNextLevel').addEventListener('click', () => {
  selectedLevel = Math.min(selectedLevel + 1, 6);
  // Update the level selection UI to match
  const levelGroup = document.getElementById('levelGroup');
  levelGroup.querySelectorAll('.option-btn').forEach(b => {
    b.classList.remove('selected');
    if (parseInt(b.dataset.val) === selectedLevel) b.classList.add('selected');
  });
  startGame();
});

document.getElementById('btnPrizes').addEventListener('click', () => {
  gameState = 'PRIZES';
  showPrizeScreen('finishScreen');
});

document.getElementById('btnPrizeBack').addEventListener('click', () => {
  gameState = 'FINISH';
  showScreen('finishScreen');
  drawFinishScreen();
});

document.getElementById('btnPrizeMainMenu').addEventListener('click', () => {
  gameState = 'TITLE';
  showScreen('titleScreen');
  drawTitleCar();
});

document.getElementById('btnMainMenu').addEventListener('click', () => {
  gameState = 'TITLE';
  showScreen('titleScreen');
  drawTitleCar();
});

// ============================================================
//  PRIZE SCREEN
// ============================================================
let pendingRedeemPrize = null;

function showPrizeScreen(returnScreen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('prizeScreen').classList.add('active');

  document.getElementById('prizeTotalPoints').textContent =
    `Your Points: ${totalPoints}`;

  const list = document.getElementById('prizeList');
  list.innerHTML = '';

  PRIZES.forEach(prize => {
    const earned = totalPoints >= prize.points;
    const item = document.createElement('div');
    item.className = 'prize-item ' + (earned ? 'earned' : 'locked');
    item.innerHTML = `
      <span class="prize-icon">${earned ? '&#9733;' : '&#128274;'}</span>
      <span class="prize-pts">${prize.points} pts</span>
      <span>${prize.reward}</span>
    `;
    if (earned) {
      item.addEventListener('click', () => {
        pendingRedeemPrize = prize;
        document.getElementById('redeemReward').textContent = prize.reward;
        document.getElementById('redeemCost').textContent =
          `This will use ${prize.points} of your ${totalPoints} points`;
        document.getElementById('redeemModal').classList.add('active');
      });
    }
    list.appendChild(item);
  });

  // Render prize bin
  const bin = document.getElementById('prizeBin');
  bin.innerHTML = '';
  if (redeemedPrizes.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'prize-bin-empty';
    empty.textContent = 'No prizes redeemed yet — keep racing!';
    bin.appendChild(empty);
  } else {
    redeemedPrizes.forEach(reward => {
      const item = document.createElement('div');
      item.className = 'prize-bin-item';
      item.innerHTML = `<span class="prize-icon">&#127942;</span><span>${reward}</span>`;
      bin.appendChild(item);
    });
  }
}

document.getElementById('btnRedeemYes').addEventListener('click', () => {
  if (pendingRedeemPrize) {
    totalPoints -= pendingRedeemPrize.points;
    saveTotalPoints(totalPoints);
    redeemedPrizes.push(pendingRedeemPrize.reward);
    saveRedeemedPrizes(redeemedPrizes);
    pendingRedeemPrize = null;
  }
  document.getElementById('redeemModal').classList.remove('active');
  showPrizeScreen('finishScreen');
});

document.getElementById('btnRedeemNo').addEventListener('click', () => {
  pendingRedeemPrize = null;
  document.getElementById('redeemModal').classList.remove('active');
});

// Option group selection
function setupOptionGroup(groupId, setter) {
  const group = document.getElementById(groupId);
  group.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      group.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      setter(btn.dataset.val);
    });
  });
}

setupOptionGroup('categoryGroup', v => { selectedCategory = v; });
setupOptionGroup('colorGroup', v => { selectedColor = v; });
setupOptionGroup('driverGroup', v => { selectedDriver = parseInt(v); });
setupOptionGroup('levelGroup', v => { selectedLevel = parseInt(v); });

// ============================================================
//  INITIALIZATION
// ============================================================
// Draw car previews
document.querySelectorAll('.carPreview').forEach(cvs => {
  drawCarPreview(cvs, cvs.dataset.color);
});

// Draw driver previews
document.querySelectorAll('.driverPreview').forEach(cvs => {
  drawDriverPreview(cvs, parseInt(cvs.dataset.driver));
});

// Start title animation
drawTitleCar();

// Start game loop
animFrameId = requestAnimationFrame(gameLoop);
</script>
